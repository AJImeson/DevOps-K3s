- name: Cert-Manager
  hosts: k3s_server
  become: true

  vars:
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    cert_manager_namespace: cert-manager
    dns_update_server: "{{ lookup('env', 'TSIG_UPDATE_SERVER') }}"
    tsig_key_name: "{{ lookup('env', 'TSIG_KEY_NAME') }}"
    tsig_algorithm: "{{ lookup('env', 'TSIG_ALGORITHM') }}"
    tsig_secret: "{{ lookup('env', 'TSIG_SECRET') }}"

  tasks:
    - name: Python3 Validation
      ansible.builtin.apt:
        name: python3-kubernetes
        state: present
        update_cache: true
    
    - name: Ce-Ma Installer
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: cert-manager
        chart_ref: oci://quay.io/jetstack/charts/cert-manager 
        chart_version: v1.21.1
        release_namespace: "{{ cert_manager_namespace }}"
        create_namespace: true
        wait: true
        values:
          crds:
            enabled: true 

    - name: TSIG Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cert-manager-tsig
            namespace: "{{ cert_manager_namespace }}"
          type: Opaque
          stringData:
            tsig-secret: "{{ tsig_secret }}"
      no_log: true

    - name: Staging Lets encrypt
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-staging
          spec:
            acme:
              server: https://acme-staging-v02.api.letsencrypt.org/directory
              privateKeySecretRef:
                name: letsencrypt-staging-account
              solvers:
                - dns01: 
                    rfc2136:
                      nameserver: "{{ dns_update_server }}:53"
                      tsigKeyName: "{{ tsig_key_name }}"
                      tsigAlgorithm: HMACSHA256
                      tsigSecretSecretRef:
                        name: cert-manager-tsig
                        key: tsig-secret

    - name: Production Lets encrypt
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              privateKeySecretRef:
                name: letsencrypt-prod-account
              solvers:
                - dns01: 
                    rfc2136:
                      nameserver: "{{ dns_update_server }}:53"
                      tsigKeyName: "{{ tsig_key_name }}"
                      tsigAlgorithm: HMACSHA256
                      tsigSecretSecretRef:
                        name: cert-manager-tsig
                        key: tsig-secret            
